name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:        #added job container
         image: 'node:20' 
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

      #  - name: Setup NodeJS Version
      #    uses: actions/setup-node@v4
      #    with:
      #      node-version: 20

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            # Path to cache → this is where npm stores downloaded packages
            path: ~/.npm

            # Cache key (unique identifier for cache entries)
            # Format breakdown:
            # 1. runner.os → ensures cache is specific to OS (Linux/Windows/macOS)
            # 2. "node-modules" → just a human-readable tag
            # 3. hashFiles('package-lock.json') → generates a unique hash based on package-lock.json
            #    → if dependencies change, this hash changes → cache invalidates → new cache created
            #    → if no change, the same cache is reused → saves build time
            key: "${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}"

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
       runs-on: ubuntu-latest
       steps:
        - name : Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Run Code-Coverage Command
          continue-on-error: true
          run: npm run coverage

        - name: Upload Code-Coverage Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
      permissions:
        packages: write
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Log in to the GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - id: lower-repo
          name: Repository to lowercase
          run: |
            echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/${{  steps.lower-repo.outputs.repository }}/solar-system:${{ github.sha }}     # Use the tags generated by the metadata action